# Perfil DES (desarrollo). SQL Server local via docker-compose.
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=parking;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:Parking!Local2024}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # Esquema comun + seed del admin de desarrollo (V5). El seed SOLO se aplica en
  # DES/tests; PRE y PRO fijan explicitamente la localizacion de esquema (bug #11).
  flyway:
    locations: classpath:db/migration,classpath:db/seed/dev

# CORS solo en DES: la SPA corre en un dev server distinto (Vite :5173).
parking:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:8080

logging:
  level:
    com.aleatica.parking: DEBUG
