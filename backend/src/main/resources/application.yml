# =====================================================================
# Configuracion base (comun a todos los perfiles). Los valores especificos
# de entorno viven en application-{des,pre,pro}.yml. Perfil activo por defecto: des.
# =====================================================================
spring:
  application:
    name: parking
  profiles:
    default: des

  # La sesion vive en BD; el datasource lo define cada perfil.
  jpa:
    hibernate:
      # Flyway es el dueno del esquema; validate detecta drift entidad/DDL al arrancar.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    # Solo migraciones de ESQUEMA. El seed del admin de desarrollo vive en
    # classpath:db/seed/dev y lo anade UNICAMENTE application-des.yml (bug #11:
    # el seed contiene una credencial documentada y jamas debe llegar a PRE/PRO).
    locations: classpath:db/migration
    baseline-on-migrate: false

  session:
    jdbc:
      initialize-schema: never   # las tablas SPRING_SESSION las crea Flyway (V1)
    store-type: jdbc

  # SMTP: Ethereal en LOCAL/DES/PRE (valores via variables de entorno, ver .env).
  mail:
    host: ${SMTP_HOST:smtp.ethereal.email}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  servlet:
    context-path: /parking-api

# Actuator: solo health e info, sin exponer detalle (OWASP API8).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# No filtrar stack traces ni mensajes internos en las respuestas de error.
server.error:
  include-message: never
  include-stacktrace: never
  include-binding-errors: never

# Parametros propios de parking.
parking:
  # Fase de despliegue: PHASE_1 (reset devuelve la temporal en pantalla) o
  # PHASE_2 (la temporal se envia por email y no se expone en la API).
  phase: PHASE_1
  auth:
    local-fallback:
      enabled: false          # fallback de emergencia desactivado por defecto
  # Bootstrap idempotente del primer administrador en despliegues limpios
  # (docker/pro), donde employees nace vacia y el seed de dev esta excluido.
  # Opt-in y desactivado por defecto; credenciales SIEMPRE por entorno (jamas aqui).
  bootstrap:
    admin:
      enabled: false          # crear admin inicial al arrancar (solo si no hay ADMIN)
      # email/password se inyectan por entorno en el perfil que lo active:
      #   PARKING_BOOTSTRAP_ADMIN_EMAIL / PARKING_BOOTSTRAP_ADMIN_PASSWORD
  retention:
    years: 2                  # purga de datos historicos a los 2 anos (RGPD)
    cron: "0 0 3 * * *"       # job diario de purga a las 03:00 (usar "-" para desactivar)
  session:
    cookie:
      secure: false           # Secure solo en pro (ver application-pro.yml)
  # Notificaciones por email (capability notifications). El envio es best-effort: un fallo
  # SMTP encola el email en dbo.email_outbox y lo reintenta el job programado.
  notifications:
    from: ${MAIL_FROM:no-reply@parking.aleatica.com}   # remitente de los correos
    max-attempts: 5                                     # intentos antes de descartar (FAILED)
    retry-interval-ms: 60000                            # periodo del job de reintento (1 min)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false
