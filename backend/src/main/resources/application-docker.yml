# Perfil DOCKER — ejecucion en contenedor Tomcat, tras nginx (Etapa A: local).
# Igual que PRO pero HTTP: la cookie de sesion NO se marca Secure (no hay TLS aun).
# La SPA y la API viven en el mismo origen (nginx hace reverse-proxy de /parking-api).
# Se activa con SPRING_PROFILES_ACTIVE=docker.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # Solo migraciones de esquema — NUNCA el seed de dev (classpath:db/seed/dev).
  # Fijado explicitamente para que un cambio futuro del default no filtre en un
  # contenedor la credencial del admin de desarrollo (bug #11, CWE-798).
  flyway:
    locations: classpath:db/migration

# Cookie de sesion sin Secure: viaja por HTTP en el entorno local contenerizado.
# Cuando la Etapa B (AWS) tenga TLS terminado, usar el perfil `pro` (secure=true).
parking:
  session:
    cookie:
      secure: false
  # Bootstrap del primer administrador por entorno (huevo y gallina en un despliegue
  # limpio: employees vacia y sin seed de dev). Idempotente: solo crea el admin si no
  # existe ninguno. Credenciales SIEMPRE por variables de entorno, nunca en el YAML.
  bootstrap:
    admin:
      enabled: ${PARKING_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${PARKING_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${PARKING_BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${PARKING_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
      last-name: ${PARKING_BOOTSTRAP_ADMIN_LAST_NAME:Parking}
      phone: ${PARKING_BOOTSTRAP_ADMIN_PHONE:}
      login: ${PARKING_BOOTSTRAP_ADMIN_LOGIN:}

logging:
  level:
    root: WARN
    com.aleatica.parking: INFO
