<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Solicitud rechazada</title>
</head>
<body>
<p>Hola <span th:text="${recipientName}">Empleado</span>,</p>
<p>
    Tu solicitud de plaza (referencia <strong th:text="${requestId}">0</strong>)
    para la fecha <strong th:text="${requestedDate}">2026-01-01</strong>
    ha sido <strong>rechazada</strong>.
</p>
<p th:if="${rejectionReason != null and !rejectionReason.isBlank()}">
    Motivo: <span th:text="${rejectionReason}">motivo</span>
</p>
<p>— parking ALEATICA</p>
</body>
</html>
