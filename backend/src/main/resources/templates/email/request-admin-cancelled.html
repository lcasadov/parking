<!DOCTYPE html>

<head>

    <title>Reserva cancelada</title>
</head>
<body>
<p>Hola <span th:text="${recipientName}">Empleado</span>,</p>
<p>
    Un administrador ha <strong>cancelado</strong> tu reserva

<p>Si crees que es un error, contacta con la administración del parking.</p>
<p>— parking ALEATICA</p>
</body>
</html>
