# Perfil PRE (preproduccion). SPA y API en el mismo origen (sin CORS).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # Solo migraciones de esquema — NUNCA el seed de dev (classpath:db/seed/dev).
  # Fijado explicitamente para que un cambio futuro del default no filtre en PRE
  # la credencial del admin de desarrollo (bug #11, CWE-798).
  flyway:
    locations: classpath:db/migration

logging:
  level:
    com.aleatica.parking: INFO
