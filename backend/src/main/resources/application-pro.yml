# Perfil PRO (produccion). SPA y API en el mismo origen (sin CORS). SMTP corporativo.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cookie de sesion marcada Secure: solo viaja por HTTPS en produccion.
parking:
  session:
    cookie:
      secure: true

logging:
  level:
    root: WARN
    com.aleatica.parking: INFO
