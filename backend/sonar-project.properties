# SonarCloud — proyecto parking (backend).
# El token se inyecta via SONAR_TOKEN en el entorno de CI (nunca en el repo).
sonar.projectKey=lcasadov_parking
sonar.organization=lcasadov

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Cobertura: JaCoCo XML generado en mvn verify.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusiones de cobertura (infraestructura sin logica; ver docs/TESTING-STRATEGY.md).
sonar.coverage.exclusions=\
  **/ParkingApplication.java,\
  **/config/**,\
  **/dto/**,\
  **/*MapperImpl.java,\
  **/package-info.java

sonar.java.source=21
sonar.sourceEncoding=UTF-8
