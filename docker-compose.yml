# Docker Compose — infraestructura local de parking (solo BD; la app se ejecuta con mvn spring-boot:run).
# SMTP usa Ethereal hosted (no se dockeriza). MailHog es opcional para UI de correo local.
services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: parking-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Parking!Local2024}"
      MSSQL_PID: "Developer"
    ports:
      # Host port parametrizable: si el host ya tiene un SQL Server nativo en 1433,
      # arrancar con MSSQL_HOST_PORT=14333 (y ajustar DB_URL en el backend). Default: 1433.
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      # SQL Server NO soporta /docker-entrypoint-initdb.d (es convencion de Postgres/MySQL);
      # la creacion de la BD la realiza el servicio `db-init` cuando el healthcheck pasa.
      - parking-mssql-data:/var/opt/mssql
    healthcheck:
      # /opt/mssql-tools18 ships with the 2022 image; -C trusts the self-signed dev cert.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Servicio de un solo uso: crea la BD `parking` cuando SQL Server esta sano.
  # Idempotente (IF DB_ID(...) IS NULL CREATE DATABASE). Termina tras ejecutar el script.
  # Reutiliza la MISMA imagen del servidor (ya incluye /opt/mssql-tools18/bin/sqlcmd):
  # la imagen standalone mcr.microsoft.com/mssql-tools18 NO existe en el registry (bug #16),
  # y asi no se descarga ninguna imagen adicional.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: parking-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Parking!Local2024}"
    volumes:
      - ./database/seed:/seed:ro
    # Sobrescribe el entrypoint del servidor: solo ejecuta sqlcmd y termina.
    # -C confia en el certificado autofirmado del servidor de desarrollo.
    entrypoint: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa
      -P \"$${MSSQL_SA_PASSWORD}\" -C -b -i /seed/00_create_database.sql"
    restart: "no"

  # Opcional: UI de correo local. Habilitar con `docker compose --profile mail up -d`.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: parking-mailhog
    profiles: ["mail"]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

volumes:
  parking-mssql-data:
    name: parking-mssql-data
