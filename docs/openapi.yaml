      description: >
        Change `reservas-employee-admin-reassign`. Establece o borra (enviando `null` o cadena
        en blanco en `parkingAddress`) la dirección postal del parking usada por el botón "Ir al
        parking" del empleado (abre Google Maps). El servicio normaliza el valor (recorta
        espacios; blanco → `null`). Queda trazado en `audit_log` con el admin como actor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateParkingAddressRequest'
      responses:
        '200':
          description: Ajuste global actualizado (incluye parkingAddress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /admin/settings/weekend-reservable:
    put:
      tags: [SystemSettings]
      operationId: updateWeekendReservable
      summary: Cambia el permiso de reservas en fin de semana (ADMIN)
      description: >
        Change `reservas-employee-admin-reassign`. Activa (`true`) o desactiva (`false`, por
        defecto) la posibilidad de crear solicitudes en sábado/domingo. Con `false`,
        `POST /requests` responde 400 `WEEKEND_NOT_RESERVABLE` para fechas de fin de semana. Queda
        trazado en `audit_log` con el admin como actor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWeekendReservableRequest'
      responses:
        '200':
          description: Ajuste global actualizado (incluye weekendReservable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /settings/approval-mode:
    get:
      tags: [SystemSettings]
      operationId: getApprovalMode
      summary: Lee el modo de aprobación global (cualquier autenticado)
      description: >
        A diferencia de `GET /admin/settings` (reservado a ADMIN), este endpoint es accesible a
        cualquier empleado autenticado (EMPLOYEE/AGENCIA/ADMIN) y expone SOLO el modo vigente
        (`MANUAL`/`AUTOMATIC`), sin la trazabilidad del último cambio (`updatedById`/`updatedAt`).
        Permite a un EMPLOYEE saber si su próxima solicitud nacerá `PENDING` o `APPROVED` antes
        de enviarla.
      responses:
        '200':
          description: Modo de aprobación vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalModeResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /settings/parking-address:
    get:
      tags: [SystemSettings]
      operationId: getParkingAddress
      summary: Lee la dirección del parking (cualquier autenticado)
      description: >
        Change `reservas-employee-admin-reassign`. Accesible a cualquier empleado autenticado
        (EMPLOYEE/AGENCIA/ADMIN); expone SOLO la dirección postal del parking (para el botón "Ir
        al parking" de "Mi Semana"), sin el modo de aprobación ni la trazabilidad. `parkingAddress`
        es `null` si aún no se ha configurado.
      responses:
        '200':
          description: Dirección del parking vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingAddressResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /settings/weekend-reservable:
    get:
      tags: [SystemSettings]
      operationId: getWeekendReservable
      summary: Lee el permiso de reservas en fin de semana (cualquier autenticado)
      description: >
        Change `reservas-employee-admin-reassign`. Accesible a cualquier empleado autenticado
        (EMPLOYEE/AGENCIA/ADMIN); expone SOLO el flag `weekendReservable`, sin el modo de aprobación
        ni la trazabilidad. La UI lo usa para decidir si ofrecer sábado/domingo como fechas
        reservables.
      responses:
        '200':
          description: Permiso de fin de semana vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekendReservableResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

# =============================================================================
# components
# =============================================================================
components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: parking_SESSION

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    QParam:
      name: q
      in: query
      required: false
      description: Texto de búsqueda libre.
      schema: { type: string, maxLength: 100 }
    ExportFormatParam:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [csv, xlsx]
        default: xlsx

  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Sin permisos para la operación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Conflicto de estado o unicidad
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServerError:
      description: Error interno
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    TooManyRequests:
      description: Límite de tasa superado (exportaciones 5/min por usuario)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    FileExport:
      description: Fichero exportado
      content:
        text/csv:
          schema: { type: string, format: binary }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }

  schemas:

    # ---- Enums ----
    Role:
      type: string
      enum: [ADMIN, EMPLOYEE]
    AuthOrigin:
      type: string
      enum: [LOCAL, ENTRA_ID]
    EmployeeCategory:
      type: string
      description: >-
        Categoria jerarquica (rango organizativo) del empleado. Orden de mayor a
        menor rango: CEO, CONSEJO, DIRECTOR_N1, DIRECTOR_N2, GERENTE,
        MANDO_INTERMEDIO, EMPLEADO.
      enum: [CEO, CONSEJO, DIRECTOR_N1, DIRECTOR_N2, GERENTE, MANDO_INTERMEDIO, EMPLEADO]
    RequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    ApprovalMode:
      type: string
      description: >-
        Modo global de aprobación de solicitudes. En MANUAL la solicitud nace PENDING
        y la resuelve el ADMIN; en AUTOMATIC nace APPROVED (auto-asignación de plaza por
        categoría/planta, o el puesto elegido).
      enum: [MANUAL, AUTOMATIC]
    ReleaseType:
      type: string
      enum: [VOLUNTARY, ADMINISTRATIVE]
    RejectionReasonCode:
      type: string
      description: Catálogo de motivos de rechazo (la UI los muestra traducidos ES/EN). Catálogo inicial; a confirmar con negocio.
      enum: [NO_AVAILABILITY, OUTSIDE_POLICY, OTHER]
    LoginResult:
      type: string
      enum: [OK, INVALID_CREDENTIALS, LOCKED, INACTIVE, NO_ACCESS, FALLBACK_OK]
    LoginPhase:
      type: string
      enum: [PHASE_1, PHASE_2, FALLBACK]
    CalendarCellState:
      type: string
      description: Estado de una celda del calendario admin.
      enum: [ASSIGNED, RELEASED, REQUEST_PENDING, REQUEST_APPROVED, FREE]
    MyWeekDayState:
      type: string
      enum: [ASSIGNED, RELEASED, REQUEST_PENDING, FREE]

    # ---- Health ----
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Estado de liveness de la API.
          example: UP

    # ---- Error ----
    ApiError:
      type: object
      required: [error, message, timestamp]
      properties:
        error:
          type: string
          description: Código corto de error.
        message:
          type: string
        fields:
          type: object
          additionalProperties: { type: string }
          description: Errores por campo (validación).
        timestamp:
          type: string
          format: date-time

    # ---- Pagination ----
    PageMeta:
      type: object
      properties:
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }
        first: { type: boolean }
        last: { type: boolean }

    # ---- Auth ----
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, maxLength: 100 }
        password: { type: string, minLength: 1 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword:
          type: string
          minLength: 10
          description: ≥10 chars, mayúscula + minúscula + dígito + símbolo; distinta de login/email.
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{10,}$'
    CurrentUser:
      type: object
      required: [employeeId, login, role, passwordMustChange]
      properties:
        employeeId: { type: integer, format: int64 }
        login: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        passwordMustChange: { type: boolean }
    CloseSsoSessionRequest:
      type: object
      required: [slo_token, client_sid]
      properties:
        slo_token: { type: string }
        client_sid: { type: string }

    # ---- Employee ----
    Employee:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        login: { type: string }
        email: { type: string, format: email }
        department: { type: string, nullable: true }
        mobilePhone: { type: string, nullable: true }
        licensePlate: { type: string, nullable: true }
        isCorporate: { type: boolean }
        authOrigin: { $ref: '#/components/schemas/AuthOrigin' }
        role: { $ref: '#/components/schemas/Role' }
        category: { $ref: '#/components/schemas/EmployeeCategory' }
        enabled: { type: boolean }
        active: { type: boolean }
        passwordMustChange: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
    EmployeeCreate:
      type: object
      required: [firstName, lastName, login, email, role, category]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 150 }
        login: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        department: { type: string, maxLength: 100 }
        mobilePhone: { type: string, maxLength: 30 }
        licensePlate: { type: string, maxLength: 15 }
        isCorporate: { type: boolean, default: false }
        authOrigin: { $ref: '#/components/schemas/AuthOrigin' }
        role: { $ref: '#/components/schemas/Role' }
        category: { $ref: '#/components/schemas/EmployeeCategory' }
    EmployeeUpdate:
      type: object
      required: [category]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 255 }
        department: { type: string, maxLength: 100 }
        mobilePhone: { type: string, maxLength: 30 }
        licensePlate: { type: string, maxLength: 15 }
        isCorporate: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        category: { $ref: '#/components/schemas/EmployeeCategory' }
    EmployeeResetPasswordResponse:
      type: object
      required: [mustChange]
      properties:
        temporaryPassword:
          type: string
          nullable: true
          description: Solo presente en Fase 1 (en Fase 2 se envía por email).
        mustChange: { type: boolean }
    PageEmployee:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Employee' }

    # ---- ParkingSpace ----
    ParkingSpace:
      type: object
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer, description: Número único de la plaza (≥ 1000). }
        label: { type: string, description: Etiqueta derivada del número. }
        floor: { type: integer, readOnly: true, description: 'Planta derivada (number/1000), solo lectura.' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    ParkingSpaceCreate:
      type: object
      required: [number]
      properties:
        number: { type: integer, minimum: 1000, description: 'Número único de la plaza (≥ 1000); la planta se deriva como number/1000.' }
        active: { type: boolean, default: true }
    ParkingSpaceConfigureRequest:
      type: object
      required: [total]
      properties:
        total: { type: integer, minimum: 0 }
    PageParkingSpace:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/ParkingSpace' }

    # ---- Desk (capability init-desks) ----
    ResourceType:
      type: string
      enum: [PARKING, DESK]
      description: Discriminador del tipo de recurso reservable.
    DeskCategory:
      type: string
      enum: [STANDARD, EXECUTIVE]
      description: >
        Categoría del puesto. Determina la auto-asignación por rango del empleado (change
        `desk-auto-assignment`, `POST /requests` DESK + AUTOMATIC sin `resourceId`): EXECUTIVE
        es exclusivo de las categorías altas (CEO, CONSEJO, DIRECTOR_N1, DIRECTOR_N2), que
        caen a STANDARD si no hay ninguno libre; el resto de categorías solo candidata
        STANDARD. Fuera de la auto-asignación (asignación fija, elección explícita), ambas
        categorías se comportan igual.
    Desk:
      type: object
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer, minimum: 1, maximum: 65 }
        label: { type: string, description: 'Etiqueta derivada del número (p. ej. D-12)' }
        category: { $ref: '#/components/schemas/DeskCategory' }
        coordX: { type: number, format: double, minimum: 0, maximum: 100 }
        coordY: { type: number, format: double, minimum: 0, maximum: 100 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    DeskCreate:
      type: object
      required: [number, category]
      properties:
        number: { type: integer, minimum: 1, maximum: 65 }
        category: { $ref: '#/components/schemas/DeskCategory' }
        coordX:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Opcional; si se omite se centra (50).
        coordY:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Opcional; si se omite se centra (50).
    DeskUpdate:
      type: object
      required: [category]
      description: 'El número es inmutable. Coordenadas opcionales: si se omiten, se conservan.'
      properties:
        category: { $ref: '#/components/schemas/DeskCategory' }
        coordX: { type: number, format: double, minimum: 0, maximum: 100 }
        coordY: { type: number, format: double, minimum: 0, maximum: 100 }
    DeskActivationRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    PageDesk:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Desk' }
    FloorPlanDeskState:
      type: string
      enum: [FREE, ASSIGNED, REQUESTED, MINE, RELEASED]
      description: >
        Estado del puesto para la fecha, relativo al empleado que consulta. FREE
        libre; ASSIGNED ocupado por un tercero; REQUESTED solicitado por un tercero;
        MINE del propio solicitante; RELEASED puesto fijo liberado (solicitable).
    FloorPlanDesk:
      type: object
      description: Proyección de un puesto en el plano para una fecha.
      properties:
        deskId: { type: integer, format: int64 }
        deskNumber: { type: integer, minimum: 1, maximum: 65 }
        category: { $ref: '#/components/schemas/DeskCategory' }
        coordX:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
          description: Coordenada X (porcentaje 0-100); null si aún sin posicionar.
        coordY:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
          description: Coordenada Y (porcentaje 0-100); null si aún sin posicionar.
        state: { $ref: '#/components/schemas/FloorPlanDeskState' }
    FloorPlanResponse:
      type: object
      description: Plano de puestos con posición y estado para una fecha.
      properties:
        date: { type: string, format: date }
        desks:
          type: array
          items: { $ref: '#/components/schemas/FloorPlanDesk' }
    FloorPlanRequestBody:
      type: object
      required: [date]
      description: Fecha para la que se solicita el puesto pinchado en el plano.
      properties:
        date: { type: string, format: date }
    DeskRequestResponse:
      type: object
      description: >-
        Resultado de solicitar un puesto desde el plano. El campo `status` ramifica por el modo
        de aprobación global: PENDING en modo MANUAL, APPROVED en modo AUTOMATIC (auto-aprobación
        del puesto pinchado).
      properties:
        requestId: { type: integer, format: int64 }
        deskId: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/FloorPlanDeskState' }
        status: { $ref: '#/components/schemas/RequestStatus' }
    DeskPositionRequest:
      type: object
      required: [coordX, coordY]
      description: Nueva posición relativa (porcentaje 0-100) de un puesto en el plano.
      properties:
        coordX: { type: number, format: double, minimum: 0, maximum: 100 }
        coordY: { type: number, format: double, minimum: 0, maximum: 100 }

    # ---- FixedAssignment ----
    FixedAssignment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        parkingSpaceId: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        active: { type: boolean }
        createdById: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        revokedById: { type: integer, format: int64, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
    FixedAssignmentPutRequest:
      type: object
      required: [parkingSpaceId, daysOfWeek]
      properties:
        parkingSpaceId:
          type: integer
          format: int64
          description: 'Recurso a asignar: plaza (PARKING) o puesto (DESK).'
        daysOfWeek:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 7 }
        resourceType:
          allOf: [ { $ref: '#/components/schemas/ResourceType' } ]
          default: PARKING
          description: Tipo de recurso; por defecto PARKING.
    PageFixedAssignment:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/FixedAssignment' }

    # ---- Release ----
    Release:
      type: object
      properties:
        id: { type: integer, format: int64 }
        parkingSpaceId: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        releaseDate: { type: string, format: date }
        type: { $ref: '#/components/schemas/ReleaseType' }
        reason: { type: string, nullable: true }
        releasedById: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
    ReleaseCreateRequest:
      type: object
      required: [releaseDate]
      properties:
        releaseDate: { type: string, format: date }
        parkingSpaceId:
          type: integer
          format: int64
          description: Opcional; si se omite, se resuelve el recurso fijo del empleado para ese día.
        resourceType:
          allOf: [ { $ref: '#/components/schemas/ResourceType' } ]
          default: PARKING
          description: Tipo de recurso; por defecto PARKING.
    AdministrativeReleaseRequest:
      type: object
      required: [employeeId, parkingSpaceId, releaseDate, reason]
      properties:
        employeeId: { type: integer, format: int64 }
        parkingSpaceId: { type: integer, format: int64 }
        releaseDate: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 500 }
        resourceType:
          allOf: [ { $ref: '#/components/schemas/ResourceType' } ]
          default: PARKING
          description: Tipo de recurso; por defecto PARKING.
    PageRelease:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Release' }

    # ---- Selección de empleado y ocupación semanal para liberación ----
    EmployeeOption:
      type: object
      description: Opción mínima de empleado (id + nombre + categoría) para un selector.
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        category: { $ref: '#/components/schemas/EmployeeCategory' }
    OccupancyOrigin:
      type: string
      description: Origen por el que un recurso queda ocupado para una fecha.
      enum: [FIXED_ASSIGNMENT, REQUEST_APPROVED]
    OccupancyItem:
      type: object
      description: Recurso ocupado (plaza o puesto) con titular y origen.
      properties:
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resourceId: { type: integer, format: int64 }
        resourceNumber: { type: integer, nullable: true }
        floor: { type: integer, nullable: true }
        employeeId: { type: integer, format: int64, nullable: true }
        employeeName: { type: string, nullable: true }
        origin: { $ref: '#/components/schemas/OccupancyOrigin' }
        requestId:
          type: integer
          format: int64
          nullable: true
          description: Solicitud aprobada que ocupa el recurso; null si es asignación fija.
    OccupancyResponse:
      type: object
      description: Recursos ocupados (plaza y/o puesto) para una fecha, con titular y origen.
      properties:
        date: { type: string, format: date }
        occupiedResources:
          type: array
          items: { $ref: '#/components/schemas/OccupancyItem' }
    EmployeeWeekDay:
      type: object
      description: Reservas de un empleado para un día (plaza y/o puesto).
      properties:
        date: { type: string, format: date }
        reservations:
          type: array
          items: { $ref: '#/components/schemas/OccupancyItem' }
    EmployeeWeekOccupancy:
      type: object
      description: Ocupación semanal de un empleado (plaza y puesto) para liberación.
      properties:
        employeeId: { type: integer, format: int64 }
        employeeName: { type: string }
        weekStart: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/EmployeeWeekDay' }

    # ---- Request ----
    Request:
      type: object
      properties:
        id: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        requestedDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/RequestStatus' }
        parkingSpaceId: { type: integer, format: int64, nullable: true }
        approvalNote: { type: string, nullable: true }
        rejectionReasonCode:
          oneOf:
            - $ref: '#/components/schemas/RejectionReasonCode'
          nullable: true
        rejectionReason: { type: string, nullable: true }
        resolvedById: { type: integer, format: int64, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        lastRemindedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Instante del último reenvío de aviso al admin (change `request-resend-notice`);
            null si nunca se reenvió. El frontend lo usa para decidir cuándo mostrar el botón
            "reenviar" (habilitado quien lo solicita cuando han pasado ≥24h desde `createdAt`
            o desde este campo, lo que sea más reciente).
        waitlisted:
          type: boolean
          default: false
          description: >
            En lista de espera (change `waitlist-requests`); relevante solo mientras
            `status = PENDING`. En modo AUTOMATIC nace `true` cuando el empleado optó por
            `waitlist: true` sin haber disponibilidad; en modo MANUAL se computa al crear
            (no había disponibilidad para ese día/tipo).
    RequestCreateRequest:
      type: object
      required: [requestedDate]
      properties:
        requestedDate: { type: string, format: date }
        resourceType:
          allOf: [ { $ref: '#/components/schemas/ResourceType' } ]
          default: PARKING
          description: Tipo de recurso solicitado; por defecto PARKING.
        resourceId:
          type: integer
          format: int64
          nullable: true
          description: >
            OPCIONAL. Puesto elegido para el modo automático + DESK (elección explícita,
            p. ej. asistente del ADMIN/visitante): la solicitud nace APPROVED con ese puesto
            (409 si no está disponible). Si se omite en DESK + AUTOMATIC, el sistema
            auto-asigna un puesto por categoría del empleado (change `desk-auto-assignment`;
            EXECUTIVE exclusivo de categorías altas con fallback a STANDARD; el resto solo
            STANDARD), y si no hay ninguno válido libre la solicitud nace PENDING (sin 409).
            En modo manual se ignora (la solicitud nace PENDING sin recurso); para PARKING
            también se ignora (la plaza la elige la auto-asignación por categoría/planta).
        waitlist:
          type: boolean
          default: false
          description: >
            Change `waitlist-requests`. Opt-in a la lista de espera: en modo AUTOMATIC +
            PARKING, si no hay ninguna plaza libre, en vez del 409 NO_AVAILABILITY clásico se
            crea la solicitud PENDING marcada `waitlisted = true`, candidata a promoción
            automática cuando se libere una plaza de esa fecha. Sin el opt-in (ausente o
            `false`) se preserva el 409 NO_AVAILABILITY (compatibilidad). Se ignora en modo
            MANUAL (siempre nace PENDING; `waitlisted` se computa por disponibilidad, no por
            este campo).
    RequestAdminAssignRequest:
      type: object
      required: [employeeId, requestedDate]
      description: >
        Asignación puntual del admin (capability `admin-punctual-assignment`): crea una
        `Request` que nace `APPROVED` para el empleado y la fecha indicados.
      properties:
        employeeId: { type: integer, format: int64 }
        requestedDate: { type: string, format: date }
        resourceType:
          allOf: [ { $ref: '#/components/schemas/ResourceType' } ]
          default: PARKING
          description: Tipo de recurso; por defecto PARKING.
        resourceId:
          type: integer
          format: int64
          nullable: true
          description: >
            Recurso a asignar. Opcional en PARKING (auto-asignación por categoría/planta
            si se omite; 409 NO_AVAILABILITY si no hay ninguna plaza libre). Obligatorio
            en DESK (400 si se omite; no hay auto-asignación de puestos).
    RequestAdminReassignRequest:
      type: object
      required: [requestId, newResourceId]
      description: >
        Reasignación administrativa (capability `admin-resource-reassignment`): cambia el recurso
        de una asignación `APPROVED` de fecha futura al recurso destino, que debe existir, ser del
        mismo tipo que el original y estar libre esa fecha.
      properties:
        requestId:
          type: integer
          format: int64
          description: Solicitud APPROVED a reasignar.
        newResourceId:
          type: integer
          format: int64
          description: Recurso destino (plaza/puesto) al que se reasigna.
    RequestAdminSwapRequest:
      type: object
      required: [requestIdA, requestIdB]
      description: >
        Intercambio (swap) administrativo (capability `admin-resource-reassignment`): intercambia
        atómicamente los recursos de dos asignaciones `APPROVED` de la misma fecha y del mismo
        tipo. Ambos identificadores deben ser distintos.
      properties:
        requestIdA:
          type: integer
          format: int64
          description: Primera solicitud APPROVED a intercambiar.
        requestIdB:
          type: integer
          format: int64
          description: Segunda solicitud APPROVED a intercambiar.
    RequestSwapResponse:
      type: object
      description: >
        Resultado de un intercambio de recursos: ambas solicitudes ya actualizadas (cada una con
        el recurso de la otra).
      properties:
        requestA:
          allOf: [ { $ref: '#/components/schemas/Request' } ]
          description: Primera solicitud, ya con el recurso de la segunda.
        requestB:
          allOf: [ { $ref: '#/components/schemas/Request' } ]
          description: Segunda solicitud, ya con el recurso de la primera.
    SuggestedParkingSpace:
      type: object
      description: >
        Vista previa de solo lectura de la plaza que se auto-asignaría a un empleado
        para una fecha (misma regla de categoría/planta que `POST /requests/admin`),
        sin crear la asignación.
      properties:
        available:
          type: boolean
          description: Indica si hay una plaza libre que se auto-asignaría.
        parkingSpaceId:
          type: integer
          format: int64
          nullable: true
          description: Identificador de la plaza sugerida; null si no hay disponibilidad.
        number:
          type: integer
          nullable: true
          description: Número humano de la plaza sugerida; null si no hay disponibilidad.
        floor:
          type: integer
          nullable: true
          description: Planta de la plaza sugerida; null si no hay disponibilidad.
    RequestApproveRequest:
      type: object
      required: [parkingSpaceId]
      properties:
        parkingSpaceId: { type: integer, format: int64 }
        approvalNote:
          type: string
          maxLength: 500
          description: Nota opcional del admin; viaja en el email de aprobación.
    RequestRejectRequest:
      type: object
      required: [reasonCode]
      description: >
        El rechazo lleva siempre un `reasonCode` del catálogo. Si `reasonCode = OTHER`,
        `rejectionReason` (texto libre, ≥5 caracteres) es obligatorio; en otro caso es opcional.
        Admite rechazar una solicitud `PENDING` o `APPROVED`; rechazar una `APPROVED` libera el
        recurso (vuelve a estar disponible para la fecha).
      properties:
        reasonCode: { $ref: '#/components/schemas/RejectionReasonCode' }
        rejectionReason: { type: string, minLength: 5, maxLength: 500 }
    RequestAdminCancelRequest:
      type: object
      required: [reason]
      description: >
        Cancelación administrativa de una solicitud `APPROVED` futura: el motivo (`reason`,
        texto libre de 5..500 caracteres) es obligatorio y queda registrado en auditoría.
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    SystemSettings:
      type: object
      description: >
        Ajuste global del sistema (modo de aprobación, dirección del parking y reservas de fin de
        semana).
      properties:
        approvalMode: { $ref: '#/components/schemas/ApprovalMode' }
        parkingAddress:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Dirección postal del parking usada por el botón "Ir al parking" del empleado (abre
            Google Maps); null si aún no se ha configurado (change `reservas-employee-admin-reassign`).
          example: 'Av. de Europa 18, 28108 Alcobendas, Madrid'
        parkingLat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: >
            Latitud del punto exacto del parking fijado en el mapa (change `admin-improvements`,
            tarea 18); null si sin fijar. Si está presente junto a `parkingLng`, el botón "Ir al
            parking" navega a las coordenadas; si no, cae a la dirección postal.
          example: 40.5405
        parkingLng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: Longitud del punto exacto del parking; null si sin fijar.
          example: -3.6510
        weekendReservable:
          type: boolean
          description: >
            Si se permiten reservas en fin de semana (sábado/domingo). Por defecto `false`: con
            `false`, `POST /requests` rechaza fechas de fin de semana con 400
            `WEEKEND_NOT_RESERVABLE` (change `reservas-employee-admin-reassign`).
          example: false
        updatedById: { type: integer, format: int64, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    ParkingAddressResponse:
      type: object
      description: >
        Dirección del parking, legible por cualquier empleado autenticado (schema de
        `GET /settings/parking-address`); sin el modo de aprobación ni la trazabilidad. Incluye las
        coordenadas del punto exacto (change `admin-improvements`, tarea 18): si están presentes,
        "Ir al parking" navega a ellas; si no, cae a la dirección postal.
      properties:
        parkingAddress:
          type: string
          nullable: true
          description: Dirección postal del parking; null si sin configurar.
          example: 'Av. de Europa 18, 28108 Alcobendas, Madrid'
        parkingLat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: Latitud del punto exacto del parking; null si sin fijar.
          example: 40.5405
        parkingLng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: Longitud del punto exacto del parking; null si sin fijar.
          example: -3.6510
    UpdateParkingAddressRequest:
      type: object
      description: >
        Cambio de la ubicación del parking (change `reservas-employee-admin-reassign`; coordenadas
        en `admin-improvements`, tarea 18). La dirección es opcional: `null` o cadena en blanco la
        borra (el servicio recorta espacios). Las coordenadas solo se persisten junto a una
        dirección no vacía; borrar la dirección descarta las coordenadas.
      properties:
        parkingAddress:
          type: string
          nullable: true
          maxLength: 500
          description: Nueva dirección postal; null o blanco para borrarla.
          example: 'Av. de Europa 18, 28108 Alcobendas, Madrid'
        parkingLat:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: Latitud del punto exacto ([-90, 90]); null si sin punto.
          example: 40.5405
        parkingLng:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: Longitud del punto exacto ([-180, 180]); null si sin punto.
          example: -3.6510
    WeekendReservableResponse:
      type: object
      description: >
        Permiso de reservas en fin de semana, legible por cualquier empleado autenticado (schema de
        `GET /settings/weekend-reservable`); sin el modo de aprobación ni la trazabilidad.
      properties:
        weekendReservable:
          type: boolean
          description: Si se permiten reservas en sábado/domingo.
          example: false
    UpdateWeekendReservableRequest:
      type: object
      required: [weekendReservable]
      description: >
        Cambio del permiso de reservas en fin de semana (change `reservas-employee-admin-reassign`).
      properties:
        weekendReservable:
          type: boolean
          description: true para permitir reservas en sábado/domingo.
          example: true
    SuggestedResource:
      type: object
      description: >
        Recurso (plaza o puesto) que se auto-asignaría al PROPIO empleado para una fecha, aplicando
        la misma lógica que la creación automatica (incluida la preferencia por el recurso fijo
        propio), sin crear la solicitud (schema de `GET /requests/suggested`).
      properties:
        available:
          type: boolean
          description: Indica si hay un recurso libre que se auto-asignaría.
        resourceLabel:
          type: string
          nullable: true
          description: Etiqueta humana del recurso sugerido; null si no hay disponibilidad.
          example: 'Plaza 3005'
    ApprovalModeResponse:
      type: object
      description: >
        Modo de aprobación global vigente, sin trazabilidad (schema de `GET /settings/approval-mode`,
        legible por cualquier empleado autenticado; a diferencia de `SystemSettings`, reservado a
        ADMIN, no expone `updatedById`/`updatedAt`).
      properties:
        approvalMode: { $ref: '#/components/schemas/ApprovalMode' }
    UpdateApprovalModeRequest:
      type: object
      required: [approvalMode]
      properties:
        approvalMode: { $ref: '#/components/schemas/ApprovalMode' }
    PageRequest:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Request' }

    # ---- Visitor ----
    Visitor:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        nationalId: { type: string }
        licensePlate: { type: string, nullable: true }
        company: { type: string, nullable: true }
        usualReason: { type: string, nullable: true }
        createdById: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    VisitorCreateRequest:
      type: object
      required: [firstName, lastName, nationalId]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 150 }
        nationalId: { type: string, minLength: 1, maxLength: 20 }
        licensePlate: { type: string, maxLength: 15 }
        company: { type: string, maxLength: 150 }
        usualReason: { type: string, maxLength: 255 }
    PageVisitor:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Visitor' }

    # ---- VisitorReservation ----
    VisitorReservation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        visitorId: { type: integer, format: int64 }
        parkingSpaceId: { type: integer, format: int64 }
        reservationDate: { type: string, format: date }
        notes: { type: string, nullable: true }
        createdById: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    VisitorReservationCreateRequest:
      type: object
      required: [visitorId, parkingSpaceId, reservationDate]
      properties:
        visitorId: { type: integer, format: int64 }
        parkingSpaceId: { type: integer, format: int64 }
        reservationDate: { type: string, format: date }
        notes: { type: string, maxLength: 500 }
    PageVisitorReservation:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/VisitorReservation' }

    # ---- Availability / Calendar ----
    AvailabilityItem:
      type: object
      properties:
        parkingSpaceId: { type: integer, format: int64 }
        label: { type: string }
    AvailabilityResponse:
      type: object
      properties:
        date: { type: string, format: date }
        availableResources:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityItem' }
    CalendarCell:
      type: object
      properties:
        date: { type: string, format: date }
        state: { $ref: '#/components/schemas/CalendarCellState' }
        employeeId: { type: integer, format: int64, nullable: true }
        employeeName: { type: string, nullable: true }
        requestId: { type: integer, format: int64, nullable: true }
    CalendarRow:
      type: object
      properties:
        parkingSpaceId: { type: integer, format: int64 }
        label: { type: string }
        cells:
          type: array
          items: { $ref: '#/components/schemas/CalendarCell' }
    AdminWeeklyCalendarResponse:
      type: object
      properties:
        weekStart: { type: string, format: date }
        days:
          type: array
          items: { type: string, format: date }
        rows:
          type: array
          items: { $ref: '#/components/schemas/CalendarRow' }
    MyWeekDay:
      type: object
      description: >
        Change `restructure-admin-workflows`, design §D4: estado diario de AMBOS tipos de
        recurso. Los campos `state`/`parkingSpaceLabel`/`requestStatus`/`requestId`
        describen la plaza (PARKING); los `desk*` describen el puesto (DESK), en paralelo
        e independientes entre sí.
      properties:
        date: { type: string, format: date }
        state: { $ref: '#/components/schemas/MyWeekDayState' }
        parkingSpaceLabel: { type: string, nullable: true }
        requestStatus:
          oneOf:
            - $ref: '#/components/schemas/RequestStatus'
          nullable: true
        requestId:
          type: integer
          format: int64
          nullable: true
          description: >
            Id de la solicitud de plaza propia de ese día; null si el día no proviene de
            una solicitud (asignación fija o libre). Permite a "Mi semana" liberar el
            recurso del día cancelando la solicitud.
        deskState: { $ref: '#/components/schemas/MyWeekDayState' }
        deskLabel: { type: string, nullable: true }
        deskRequestStatus:
          oneOf:
            - $ref: '#/components/schemas/RequestStatus'
          nullable: true
        deskRequestId:
          type: integer
          format: int64
          nullable: true
          description: Id de la solicitud de puesto propia de ese día; null si no aplica.
        waitlisted:
          type: boolean
          default: false
          description: >
            Change `waitlist-requests`. En lista de espera la solicitud de plaza propia de
            ese día (solo relevante cuando `state = REQUEST_PENDING`).
        deskWaitlisted:
          type: boolean
          default: false
          description: Igual que `waitlisted`, para la solicitud de puesto propia de ese día.
        releaseId:
          type: integer
          format: int64
          nullable: true
          description: >
            Id de la liberación propia de la PLAZA de ese día cuando el día está en estado
            `RELEASED` por una liberación del propio empleado aún cancelable (hoy o futuro); null en
            otro caso. Permite a "Mi Semana" ofrecer "Deshacer ausencia" cancelándola con
            `DELETE /releases/{id}` (change `reservas-employee-admin-reassign`).
        deskReleaseId:
          type: integer
          format: int64
          nullable: true
          description: Igual que `releaseId`, para la liberación propia del PUESTO de ese día.
    MyWeekResponse:
      type: object
      properties:
        weekStart: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/MyWeekDay' }

    # ---- Audit ----
    AuditLogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actorEmployeeId: { type: integer, format: int64, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: integer, format: int64, nullable: true }
        details: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    LoginLogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        loginAttempted: { type: string }
        employeeId: { type: integer, format: int64, nullable: true }
        result: { $ref: '#/components/schemas/LoginResult' }
        phase: { $ref: '#/components/schemas/LoginPhase' }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    PageAuditLogEntry:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/AuditLogEntry' }
    PageLoginLogEntry:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/LoginLogEntry' }
