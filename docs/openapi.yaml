# =============================================================================
# parking API — OpenAPI 3.1 contract
#
# Convención de nomenclatura (autoridad: README "Nomenclatura del código"):
#   - Identificadores de código en INGLÉS: rutas, operationId, tags, schemas,
#     enums y campos. El prompt original venía en español (/empleados, Empleado,
#     EstadoSolicitud, mensaje, campos…); aquí aparecen sus equivalentes en
#     inglés (/employees, Employee, RequestStatus, message, fields…).
#   - Esquema de datos: docs/data-model.md (no se inventan campos de entidad).
#   - Auth / RBAC: docs/security-design.md.
#   - Endpoints: lista del prompt 4 (el README ya no incluye sección "API REST").
#   - Alcance: núcleo de parking (plazas), puestos de oficina y plano interactivo
#     (desks/floor plan), visitantes y reservas, asignaciones fijas, solicitudes,
#     liberaciones, disponibilidad, calendario, auditoría, exportaciones y health.
#   - operationId: convención <verb><Resource> en camelCase.
# =============================================================================
openapi: 3.1.0
info:
  title: parking API
  description: |
    API REST de gestión de plazas de parking de ALEATICA.
    Autenticación por cookie de sesión (`parking_SESSION`). Fase 1: login local.
    Fase 2: SSO ALEATICA (la landing autentica, parking autoriza).
  version: 1.0.0
  contact:
    name: Equipo parking
    email: "_[pendiente]_"
servers:
  - url: http://localhost:8080/parking-api/api/v1
    description: Desarrollo local
  - url: https://parking.aleatica.com/parking-api/api/v1
    description: Producción

tags:
  - name: Auth
    description: Autenticación y sesión (Fase 1 local, Fase 2 SSO)
  - name: Employees
    description: Gestión de empleados (Empleados)
  - name: ParkingSpaces
    description: Gestión de plazas (Plazas)
  - name: Desks
    description: Gestión de puestos de oficina (Puestos)
  - name: Floor Plan
    description: Plano interactivo de puestos (estado por fecha, solicitud directa y posiciones)
  - name: FixedAssignments
    description: Asignaciones fijas por día de la semana
  - name: Requests
    description: Solicitudes puntuales de plaza
  - name: Releases
    description: Liberaciones voluntarias y administrativas
  - name: Visitors
    description: Fichas de visitante
  - name: VisitorReservations
    description: Reservas de plaza para visitantes
  - name: Availability
    description: Disponibilidad de recursos por fecha
  - name: Calendar
    description: Calendario semanal admin y "Mi Semana"
  - name: Occupancy
    description: >
      Ocupación de recursos por fecha (ADMIN/AGENCIA), base del pivote por-fecha del
      destino "Liberar"
  - name: Audit
    description: Auditoría funcional y logs de login
  - name: SystemSettings
    description: Ajuste global del sistema (modo de aprobación de solicitudes)
  - name: Exports
    description: Exportaciones a CSV/XLSX
  - name: Health
    description: Comprobación pública de disponibilidad de la API (liveness)

# Por defecto toda operación exige la cookie de sesión.
# Los endpoints públicos la anulan con `security: []`.
security:
  - sessionCookie: []

paths:

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Estado de la API (liveness)
      description: >
        🟢 Endpoint público. Devuelve `{"status":"UP"}` si la API responde.
        Contrato estable y mínimo, sin exponer detalles de infraestructura.
      security: []
      responses:
        '200':
          description: La API está operativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login local (Fase 1)
      description: >
        🟢 Fase 1. Autentica con login y contraseña (BCrypt). Bloqueo tras 5
        intentos fallidos durante 15 min. Devuelve la identidad y setea la
        cookie `parking_SESSION`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado; cookie de sesión emitida
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cierra la sesión actual
      responses:
        '204': { description: Sesión invalidada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Identidad del usuario autenticado
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Cambio de la propia contraseña
      description: >
        Política: ≥10 caracteres, mayúscula + minúscula + dígito + símbolo,
        distinta de login y email. Obligatorio en primer login tras reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204': { description: Contraseña actualizada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /ssocallback:
    servers:
      - url: http://localhost:8080/parking-api
        description: Desarrollo local (fuera de /api/v1)
      - url: https://parking.aleatica.com/parking-api
        description: Producción (fuera de /api/v1)
    get:
      tags: [Auth]
      operationId: ssoCallback
      summary: Callback SSO (Fase 2)
      description: >
        🔵 Fase 2. Recibe el `id_token` de la landing, valida firma/iss/aud/exp,
        autoriza contra `employees` por `login=username` y crea la sesión.
        Montado fuera de `/api/v1`.
      security: []
      parameters:
        - name: id_token
          in: query
          required: true
          schema: { type: string }
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        '302':
          description: Autorizado; redirección a `redirect_uri` con cookie
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /CloseSSOSessionID:
    servers:
      - url: http://localhost:8080/parking-api
        description: Desarrollo local (fuera de /api/v1)
      - url: https://parking.aleatica.com/parking-api
        description: Producción (fuera de /api/v1)
    post:
      tags: [Auth]
      operationId: closeSsoSession
      summary: Single Logout desde la landing (Fase 2)
      description: >
        🔵 Fase 2. Valida `slo_token` y localiza la sesión por `client_sid` en
        `SPRING_SESSION` para invalidarla. Autenticado por el token firmado, no
        por la cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSsoSessionRequest'
      responses:
        '200': { description: Sesión invalidada }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # Employees
  # ---------------------------------------------------------------------------
  /employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: Lista empleados (ADMIN)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/QParam'
        - name: active
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Página de empleados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEmployee'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Crea un empleado (ADMIN)
      description: >
        Alta manual. `login` y `email` únicos (409 en colisión). En Fase 2 nace
        sin contraseña local; la contraseña se obtiene vía reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
      responses:
        '201':
          description: Empleado creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /employees/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Employees]
      operationId: updateEmployee
      summary: Modifica un empleado (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdate'
      responses:
        '200':
          description: Empleado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Employees]
      operationId: deactivateEmployee
      summary: Baja lógica de un empleado (ADMIN)
      description: Marca `active=false`; no borra la fila.
      responses:
        '204': { description: Empleado dado de baja }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /employees/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Employees]
      operationId: reactivateEmployee
      summary: Reactiva un empleado dado de baja (ADMIN)
      responses:
        '204': { description: Empleado reactivado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /employees/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Employees]
      operationId: resetEmployeePassword
      summary: Reset administrativo de contraseña (ADMIN)
      description: >
        🟢 Fase 1: devuelve la contraseña temporal para mostrarla en pantalla
        una sola vez. 🔵 Fase 2: se envía por email y no se devuelve en claro.
        Marca `passwordMustChange=true`.
      responses:
        '200':
          description: Contraseña reseteada (temporal en claro solo en Fase 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResetPasswordResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /employees/export:
    get:
      tags: [Employees, Exports]
      operationId: exportEmployees
      summary: Exporta empleados a CSV/XLSX (ADMIN)
      parameters:
        - $ref: '#/components/parameters/ExportFormatParam'
      responses:
        '200': { $ref: '#/components/responses/FileExport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /employees/me/export:
    get:
      tags: [Employees, Exports]
      operationId: exportMyData
      summary: Exporta mis propios datos personales (EMPLOYEE/ADMIN)
      description: >
        Derecho de acceso RGPD (security-design §12): el usuario autenticado
        exporta sus propios datos personales. Cada uno solo accede a los suyos.
      parameters:
        - $ref: '#/components/parameters/ExportFormatParam'
      responses:
        '200': { $ref: '#/components/responses/FileExport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # ParkingSpaces
  # ---------------------------------------------------------------------------
  /parking-spaces:
    get:
      tags: [ParkingSpaces]
      operationId: listParkingSpaces
      summary: Lista plazas (ADMIN)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: active
          in: query
          required: false
          schema: { type: boolean }
        - name: floor
          in: query
          required: false
          description: Filtro por planta (planta f = números f*1000..f*1000+999).
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Página de plazas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageParkingSpace'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [ParkingSpaces]
      operationId: createParkingSpace
      summary: Crea una plaza (ADMIN)
      description: '`number` entero único ≥ 1000 (409 en colisión); `label` y `floor` se derivan del número.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingSpaceCreate'
      responses:
        '201':
          description: Plaza creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingSpace'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /parking-spaces/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [ParkingSpaces]
      operationId: getParkingSpace
      summary: Detalle de una plaza (ADMIN o EMPLOYEE)
      description: 'Excepción al resto del recurso (ADMIN-only): expone solo el detalle por id, sin listado, para que un EMPLOYEE resuelva el número/etiqueta real de una plaza fija propia (patrón simétrico a `GET /desks/{id}`).'
      responses:
        '200':
          description: Plaza
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingSpace'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [ParkingSpaces]
      operationId: updateParkingSpace
      summary: Modifica una plaza (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingSpaceCreate'
      responses:
        '200':
          description: Plaza actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingSpace'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /parking-spaces/configure:
    post:
      tags: [ParkingSpaces]
      operationId: configureParkingSpaces
      summary: Configura el número total de plazas (ADMIN)
      description: Alta/ajuste masivo del total de plazas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingSpaceConfigureRequest'
      responses:
        '200':
          description: Configuración aplicada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParkingSpace'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # Desks (capability init-desks)
  # ---------------------------------------------------------------------------
  /desks:
    get:
      tags: [Desks]
      operationId: listDesks
      summary: Lista puestos (ADMIN o EMPLOYEE)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: active
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Página de puestos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDesk'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Desks]
      operationId: createDesk
      summary: Crea un puesto (ADMIN)
      description: '`number` único en el rango 1-65 (400 fuera de rango, 409 en colisión).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeskCreate'
      responses:
        '201':
          description: Puesto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desk'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /desks/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Desks]
      operationId: getDesk
      summary: Detalle de un puesto (ADMIN o EMPLOYEE)
      responses:
        '200':
          description: Puesto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desk'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Desks]
      operationId: updateDesk
      summary: Modifica categoría y coordenadas de un puesto (ADMIN)
      description: 'El `number` es inmutable. Coordenadas en el rango 0-100 (400 fuera de rango).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeskUpdate'
      responses:
        '200':
          description: Puesto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desk'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /desks/{id}/activation:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Desks]
      operationId: setDeskActivation
      summary: Activa o desactiva un puesto (ADMIN)
      description: Un puesto inactivo deja de aparecer como disponible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeskActivationRequest'
      responses:
        '200':
          description: Estado del puesto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desk'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # Floor Plan
  # ---------------------------------------------------------------------------
  /floor-plan:
    get:
      tags: [Floor Plan]
      operationId: getFloorPlan
      summary: Plano de puestos por fecha (ADMIN o EMPLOYEE)
      description: >
        Proyección única (sin N+1) de los puestos activos para una fecha, con su
        posición (coordX/coordY) y su estado relativo al empleado autenticado. El
        propio puesto aparece como MINE; los de terceros como ASSIGNED/REQUESTED
        sin revelar titulares. La fecha debe estar en la ventana hoy..hoy+14
        (400 OUTSIDE_REQUEST_WINDOW fuera de ella).
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Plano de la fecha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorPlanResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /floor-plan/desks/{deskId}/request:
    parameters:
      - name: deskId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Floor Plan]
      operationId: requestDeskFromFloorPlan
      summary: Solicita un puesto desde el plano (EMPLOYEE)
      description: >
        Crea una solicitud PENDING del puesto pinchado para la fecha, solo si el
        puesto está libre. Reutiliza el ciclo de solicitudes: 409
        REQUEST_ALREADY_PENDING si el empleado ya tiene un puesto pendiente esa
        fecha; 409 SPACE_NOT_AVAILABLE si el puesto no está libre (asignado,
        solicitado por otro o inactivo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FloorPlanRequestBody'
      responses:
        '201':
          description: Solicitud de puesto creada (PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeskRequestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /floor-plan/desks/{deskId}/position:
    parameters:
      - name: deskId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      tags: [Floor Plan]
      operationId: updateDeskPosition
      summary: Reposiciona un puesto en el plano (ADMIN)
      description: 'Persiste coordX/coordY (porcentaje 0-100) del marcador. 400 fuera de rango.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeskPositionRequest'
      responses:
        '204':
          description: Posición persistida
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # FixedAssignments
  # ---------------------------------------------------------------------------
  /fixed-assignments:
    get:
      tags: [FixedAssignments]
      operationId: listFixedAssignments
      summary: Lista todas las asignaciones fijas activas (ADMIN)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de asignaciones fijas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageFixedAssignment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /fixed-assignments/employee/{employeeId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [FixedAssignments]
      operationId: getEmployeeFixedAssignments
      summary: Asignaciones fijas de un empleado
      description: >
        ADMIN cualquiera; EMPLOYEE solo las suyas (verificación de objeto). Devuelve la
        lista plana de asignaciones activas de AMBOS tipos de recurso. Para el prefill
        del modal de empleado, el cliente agrupa por `resourceType`: las filas `PARKING`
        reconstruyen la plaza fija ({ parkingSpaceId, dayOfWeek[] }) y las `DESK` el
        puesto fijo ({ parkingSpaceId, dayOfWeek[] }). Un empleado puede tener plaza y
        puesto el mismo día (recursos independientes).
      responses:
        '200':
          description: Asignaciones fijas del empleado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixedAssignment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [FixedAssignments]
      operationId: setEmployeeFixedAssignments
      summary: Asigna/modifica la asignación fija de un empleado (ADMIN)
      description: >
        Una plaza no puede asignarse a dos empleados el mismo día; un empleado no
        puede tener dos recursos el mismo día (409). Aplica solo desde la fecha
        actual; no afecta a días pasados ni a aprobaciones previas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssignmentPutRequest'
      responses:
        '200':
          description: Asignación fija establecida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixedAssignment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [FixedAssignments]
      operationId: revokeEmployeeFixedAssignment
      summary: Revoca (lógicamente) la asignación fija de un empleado (ADMIN)
      description: >
        Marca `active=false`, `revoked_at`, `revoked_by_id`. No borra. El parámetro
        opcional `resourceType` acota la revocación a un tipo de recurso: si se omite se
        revocan TODAS las asignaciones activas del empleado (comportamiento
        retrocompatible); si se indica (`PARKING` o `DESK`) se revocan SOLO las de ese
        tipo, dejando intactas las del otro. Devuelve 404 cuando no hay ninguna
        asignación activa del tipo solicitado.
      parameters:
        - name: resourceType
          in: query
          required: false
          description: >
            Tipo de recurso a revocar. Omitido = todos los tipos (default
            retrocompatible). `PARKING` revoca solo la plaza fija; `DESK` solo el puesto.
          schema:
            $ref: '#/components/schemas/ResourceType'
      responses:
        '204': { description: Asignación revocada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # Releases
  # ---------------------------------------------------------------------------
  /releases/mine:
    get:
      tags: [Releases]
      operationId: listMyReleases
      summary: Mis liberaciones (EMPLOYEE)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de liberaciones propias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRelease'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /releases:
    post:
      tags: [Releases]
      operationId: createRelease
      summary: Liberación voluntaria (EMPLOYEE)
      description: >
        Solo el dueño de la asignación fija, y solo para fechas presentes o
        futuras. Tipo `VOLUNTARY`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseCreateRequest'
      responses:
        '201':
          description: Liberación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /releases/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [Releases]
      operationId: cancelRelease
      summary: Anula una liberación futura propia (EMPLOYEE)
      responses:
        '204': { description: Liberación anulada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /releases/administrative:
    post:
      tags: [Releases]
      operationId: createAdministrativeRelease
      summary: Liberación administrativa (ADMIN)
      description: >
        El admin libera el recurso fijo de cualquier empleado para una fecha
        presente o futura, con motivo. Tipo `ADMINISTRATIVE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministrativeReleaseRequest'
      responses:
        '201':
          description: Liberación administrativa creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /releases/administrative/mine:
    get:
      tags: [Releases]
      operationId: listMyAdministrativeReleases
      summary: Mis liberaciones administrativas (ADMIN/AGENCIA)
      description: >
        Change `restructure-admin-workflows`, design §D5. Historial de solo lectura de
        las liberaciones administrativas creadas por el actor de la sesión
        (`releasedById` = actor), en orden de actividad reciente. Accesible a ADMIN y
        AGENCIA; cada actor solo ve las que él mismo ha creado.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de liberaciones administrativas propias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRelease'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /releases/employees:
    get:
      tags: [Releases]
      operationId: listSelectableReleaseEmployees
      summary: Empleados seleccionables para liberación (ADMIN/AGENCIA)
      description: >
        Listado de solo lectura de empleados activos (id + nombre + categoría) para
        poblar el selector del flujo de liberación administrativa. La categoría
        permite al frontend mostrar el rango del empleado en el selector. No expone
        datos de contacto ni credenciales y es independiente del CRUD de empleados
        (reservado a ADMIN). Accesible a ADMIN y AGENCIA; cualquier otro rol → 403.
      responses:
        '200':
          description: Empleados seleccionables (id + nombre + categoría)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeOption'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /releases/employees/{employeeId}/occupancy:
    get:
      tags: [Releases]
      operationId: getEmployeeWeekOccupancy
      summary: Ocupación semanal de un empleado para liberación (ADMIN/AGENCIA)
      description: >
        Por cada uno de los siete días de la semana, las reservas del empleado en
        plaza y puesto con su origen (`FIXED_ASSIGNMENT` / `REQUEST_APPROVED`), el
        recurso (número/planta) y el `requestId` cuando la ocupación proviene de
        una solicitud aprobada. Accesible a ADMIN y AGENCIA; cualquier otro rol → 403.
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: weekStart
          in: query
          required: true
          description: Lunes de la semana a consultar (ISO-8601; se normaliza al lunes).
          schema: { type: string, format: date }
      responses:
        '200':
          description: Ocupación semanal del empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeWeekOccupancy'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------------------
  # Requests
  # ---------------------------------------------------------------------------
  /requests/mine:
    get:
      tags: [Requests]
      operationId: listMyRequests
      summary: Mis solicitudes (EMPLOYEE)
      description: >
        Lista paginada de las solicitudes propias. Admite filtro opcional por estado y por
        rango de fecha de recurso (`requestedDate`) inclusive `[from, to]` para la navegación
        por meses de "Mis solicitudes"; cuando se pasa el rango, el orden es por `requestedDate`
        ascendente (change `reservas-employee-admin-reassign`, Feature D).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - name: from
          in: query
          required: false
          description: Fecha de recurso mínima (inclusive, ISO-8601 date).
          schema:
            type: string
            format: date
            example: '2026-07-01'
        - name: to
          in: query
          required: false
          description: Fecha de recurso máxima (inclusive, ISO-8601 date).
          schema:
            type: string
            format: date
            example: '2026-07-31'
      responses:
        '200':
          description: Página de solicitudes propias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRequest'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/suggested:
    get:
      tags: [Requests]
      operationId: suggestedResource
      summary: Vista previa del recurso auto-asignado al propio empleado (EMPLOYEE)
      description: >
        Change `reservas-employee-admin-reassign`. Devuelve el recurso (plaza/puesto) que se
        auto-asignaría al propio empleado esa fecha aplicando la MISMA lógica que `POST /requests`
        en modo automático —incluida la preferencia por el recurso fijo propio (Feature A)— sin
        crear la solicitud. Si no hay ninguno libre, responde 200 con `available = false`.
      parameters:
        - name: date
          in: query
          required: true
          description: Fecha a consultar (ISO-8601 date).
          schema: { type: string, format: date, example: '2026-07-10' }
        - name: resourceType
          in: query
          required: false
          description: Tipo de recurso a sugerir; por defecto PARKING.
          schema:
            allOf: [ { $ref: '#/components/schemas/ResourceType' } ]
            default: PARKING
      responses:
        '200':
          description: Recurso sugerido (o available = false si no hay disponibilidad)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedResource'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests:
    post:
      tags: [Requests]
      operationId: createRequest
      summary: Crea una solicitud para una fecha (EMPLOYEE)
      description: >
        Ventana: hoy..hoy+14 días naturales. Máximo una solicitud `PENDING` por
        empleado y fecha (409 en duplicado).


        Según el modo de aprobación global (`GET /admin/settings`): en `MANUAL` la
        solicitud nace `PENDING`; en `AUTOMATIC` nace `APPROVED` (auto-asignación de
        plaza por categoría/planta para PARKING, o de puesto por categoría para DESK,
        o el puesto elegido si se indica `resourceId`). En modo `AUTOMATIC` para
        PARKING, si no hay ninguna plaza libre se responde `409` con
        `error = NO_AVAILABILITY` y la solicitud no se crea.


        Change `desk-auto-assignment`: para `DESK` en modo `AUTOMATIC`, `resourceId`
        es **opcional**. Si se omite, el sistema auto-asigna un puesto libre según la
        categoría del empleado, con la MISMA frontera de rango que PARKING
        (`CEO, CONSEJO, DIRECTOR_N1, DIRECTOR_N2` = categorías altas): una categoría
        alta recibe un puesto `EXECUTIVE` libre si lo hay, y si no un `STANDARD`; el
        resto de categorías recibe únicamente un puesto `STANDARD` (nunca un
        `EXECUTIVE`). Si no hay ningún puesto válido libre para la categoría, la
        solicitud nace `PENDING` igualmente (NO se responde `409` ni se exige elegir
        puesto). Si se indica `resourceId` (elección explícita), el comportamiento no
        cambia: nace `APPROVED` con ese puesto, `409` si no está disponible.


        Change `reservas-employee-admin-reassign`: si el ajuste global `weekendReservable`
        es `false` (por defecto), una `requestedDate` en sábado o domingo se rechaza con
        `400` y `error = WEEKEND_NOT_RESERVABLE` (detalle en `fields.requestedDate`); con
        `true`, se permite. La regla solo aplica al autoservicio del empleado, no a la
        asignación puntual del admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreateRequest'
      responses:
        '201':
          description: Solicitud creada (PENDING en modo manual, APPROVED en modo automático)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: >
            Fecha pasada (`OUTSIDE_REQUEST_WINDOW`) o fin de semana con reservas de fin de
            semana deshabilitadas (`WEEKEND_NOT_RESERVABLE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            Conflicto: solicitud `PENDING` duplicada, plaza/puesto no disponible, o
            `NO_AVAILABILITY` (modo automático sin plaza libre para la fecha).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/admin:
    post:
      tags: [Requests]
      operationId: adminAssignRequest
      summary: Asignación puntual de un recurso a un empleado (ADMIN)
      description: >
        Change `restructure-admin-workflows`, capability `admin-punctual-assignment`.
        Crea una asignación para una fecha concreta que nace directamente `APPROVED`
        (sin pasar por `PENDING`), reutilizando la validación de disponibilidad y la
        auto-asignación por categoría/planta ya existentes en `POST /requests` modo
        automático. Si se omite `resourceId` en `PARKING`, se auto-asigna una plaza
        libre; si no hay ninguna, `409` con `error = NO_AVAILABILITY`. En `DESK` el
        `resourceId` es obligatorio (no hay auto-asignación de puestos): `400` si se
        omite. Queda trazada en `audit_log` con el admin como actor. No hereda la
        ventana de 14 días del autoservicio, pero sí rechaza una fecha pasada (`400`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAdminAssignRequest'
      responses:
        '201':
          description: Asignación creada en estado APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Conflicto: el recurso indicado no está disponible esa fecha, o
            `NO_AVAILABILITY` (auto-asignación de PARKING sin plaza libre).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/admin/reassign:
    post:
      tags: [Requests]
      operationId: adminReassignRequest
      summary: Reasigna el recurso de una asignación por fecha (ADMIN)
      description: >
        Change `reservas-employee-admin-reassign`, capability `admin-resource-reassignment`
        (Feature B). Cambia el recurso (plaza/puesto) de una asignación `APPROVED` de fecha
        futura al recurso destino indicado, validando que esté libre y sea del mismo tipo que
        el original (409 `SPACE_NOT_AVAILABLE` si está ocupado). El recurso anterior queda
        libre; el empleado afectado recibe un email con su recurso resultante y la fecha (best
        effort). Queda trazado en `audit_log` con el admin como actor. Si `newResourceId`
        coincide con el recurso actual, la operación es idempotente (no cambia nada ni notifica).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAdminReassignRequest'
      responses:
        '200':
          description: Solicitud reasignada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Conflicto: la solicitud no es `APPROVED` de fecha futura, o el recurso destino no
            está disponible esa fecha (`SPACE_NOT_AVAILABLE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/admin/swap:
    post:
      tags: [Requests]
      operationId: adminSwapRequests
      summary: Intercambia (swap) recursos entre dos asignaciones por fecha (ADMIN)
      description: >
        Change `reservas-employee-admin-reassign`, capability `admin-resource-reassignment`
        (Feature B). Intercambia en una operación ATÓMICA los recursos de dos asignaciones
        `APPROVED` de la misma `requestedDate` y del mismo tipo; si cualquiera de los dos lados
        falla, no se aplica ninguno (rollback total). Ambos empleados afectados reciben un email
        con su recurso resultante y la fecha (best effort). Queda trazado en `audit_log` con el
        admin como actor. Responde `409` si son la misma solicitud, no están ambas `APPROVED`,
        o difieren en fecha o tipo de recurso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAdminSwapRequest'
      responses:
        '200':
          description: Ambas solicitudes intercambiadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestSwapResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Conflicto: misma solicitud, no ambas `APPROVED`, o difieren en fecha o tipo de recurso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/admin/suggested-space:
    get:
      tags: [Requests]
      operationId: getSuggestedParkingSpace
      summary: Vista previa de la plaza auto-asignada a un empleado (ADMIN)
      description: >
        Devuelve la plaza que se auto-asignaría a ese empleado para esa fecha según su
        categoría/planta, reutilizando la MISMA regla que `POST /requests/admin` y el
        modo automático de `POST /requests`, sin crear la asignación. Pensado para que
        el resumen del asistente de reserva muestre la plaza sugerida antes de
        confirmar. Si no hay ninguna plaza libre esa fecha, responde `200` con
        `available = false` (no es un error).
      parameters:
        - name: employeeId
          in: query
          required: true
          description: Empleado destino de la futura asignación.
          schema: { type: integer, format: int64 }
        - name: date
          in: query
          required: true
          description: Fecha a consultar (ISO-8601).
          schema: { type: string, format: date }
      responses:
        '200':
          description: Plaza sugerida (o `available = false` si no hay disponibilidad)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedParkingSpace'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/pending:
    get:
      tags: [Requests]
      operationId: listPendingRequests
      summary: Solicitudes pendientes, orden FIFO (ADMIN)
      description: Ordenadas por `created_at ASC` (FIFO informativo).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Página de solicitudes pendientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Requests]
      operationId: getRequest
      summary: Detalle de una solicitud (ADMIN)
      responses:
        '200':
          description: Solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Requests]
      operationId: cancelRequest
      summary: Cancela la propia solicitud PENDING o APPROVED futura (EMPLOYEE)
      description: >
        Cancela una solicitud `PENDING` (cualquier fecha) o una solicitud `APPROVED`
        cuya `requestedDate` es hoy o posterior, en cuyo caso la cancelación libera el
        recurso asignado (plaza/puesto), que vuelve a estar disponible para esa fecha.
        Una solicitud `APPROVED` de fecha pasada, o en estado terminal
        (`REJECTED`/`CANCELLED`), devuelve 409.
      responses:
        '200':
          description: >
            Solicitud cancelada (PENDING, o APPROVED de fecha futura con el recurso liberado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            La solicitud es APPROVED de fecha pasada o está en estado terminal
            (REJECTED/CANCELLED); no admite cancelación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Requests]
      operationId: resendRequest
      summary: Reenvía el aviso de la propia solicitud PENDING estancada (EMPLOYEE)
      description: >
        Change `request-resend-notice`. Re-notifica por email a todos los administradores
        activos, reutilizando el mismo evento que la creación de la solicitud
        (`REQUEST_CREATED`), y actualiza `lastRemindedAt` al instante actual. Solo el empleado
        dueño de la solicitud puede reenviarla (403 si es ajena); solo si sigue `PENDING` (409
        `REQUEST_NOT_PENDING` en otro caso); y solo si han pasado al menos 24h desde su
        `createdAt` o desde su `lastRemindedAt` (lo que sea más reciente); si no, 409
        `RESEND_TOO_SOON`.
      responses:
        '200':
          description: Aviso reenviado; solicitud con lastRemindedAt actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            La solicitud no está PENDING (`error = REQUEST_NOT_PENDING`), o aún no ha pasado el
            tiempo mínimo desde la creación/último reenvío (`error = RESEND_TOO_SOON`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/{id}/admin-cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Requests]
      operationId: adminCancelRequest
      summary: Cancela administrativamente una solicitud APPROVED futura (ADMIN/AGENCIA)
      description: >
        Un `ADMIN` o `AGENCIA` cancela la solicitud `APPROVED` de fecha futura de cualquier
        empleado con un motivo obligatorio; la solicitud pasa a `CANCELLED`, el recurso queda
        liberado para esa fecha y la acción se registra en auditoría. Rechaza (409) si la
        solicitud no está `APPROVED` o es de fecha pasada; 403 si el rol no es ADMIN ni AGENCIA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAdminCancelRequest'
      responses:
        '200':
          description: Solicitud cancelada y recurso liberado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          description: Motivo ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La solicitud no está APPROVED o es de fecha pasada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Requests]
      operationId: approveRequest
      summary: Aprueba una solicitud asignando plaza (ADMIN)
      description: >
        Valida disponibilidad de la plaza elegida; si no está disponible o
        colisiona (concurrencia), devuelve 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestApproveRequest'
      responses:
        '200':
          description: Solicitud aprobada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /requests/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/IdPath'
