        titular y origen (`FIXED_ASSIGNMENT` / `REQUEST_APPROVED`); los libres se omiten.
        Base del pivote por-fecha del destino "Liberar" (change
        `restructure-admin-workflows`, design §D5); accesible a ADMIN y AGENCIA.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
