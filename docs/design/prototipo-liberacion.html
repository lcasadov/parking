<!-- ============ MAIN · LIBERACIÓN ADMINISTRATIVA ============ -->\n  <sc-if value="{{ isLib }}" hint-placeholder-val="{{ false }}">\n  <main style="flex:1;min-width:0;padding:34px 44px 120px;position:relative">\n    <div style="margin-bottom:24px">\n      <div style="font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:10px">Operativa<\u002Fdiv>\n      <h1 style="font-family:var(--title-font);font-size:52px;font-weight:600;line-height:1;letter-spacing:-.015em;margin:0">Liberación administrativa<\u002Fh1>\n      <p style="margin:12px 0 0;font-size:16px;color:var(--ink-soft);max-width:600px">Selecciona un empleado, revisa sus reservas de la semana y libera las que no vaya a usar. Un único motivo se aplica a todas y queda en la auditoría.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style="max-width:860px">\n      <!-- Empleado -->\n      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px">Empleado<\u002Flabel>\n      <div style="display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:18px">\n        <div style="width:36px;height:36px;flex:none;border-radius:50%;background:#E9F3D8;color:#527F16;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px">DE<\u002Fdiv>\n        <div style="flex:1;min-width:0">\n          <div style="font-size:15.5px;font-weight:700;line-height:1.1">Dev Empleado<\u002Fdiv>\n          <div style="font-size:12px;color:var(--ink-faint)">Operaciones · 3 reservas esta semana<\u002Fdiv>\n        <\u002Fdiv>\n        <i class="ti ti-selector" style="font-size:20px;color:var(--ink-faint)"><\u002Fi>\n      <\u002Fdiv>\n\n      <!-- Semana -->\n      <div style="display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:22px">\n        <div style="display:flex;gap:4px">\n          <button class="sol-btn" style="width:38px;height:38px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center"><i class="ti ti-chevron-left" style="font-size:17px"><\u002Fi><\u002Fbutton>\n          <button class="sol-btn" style="width:38px;height:38px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center"><i class="ti ti-chevron-right" style="font-size:17px"><\u002Fi><\u002Fbutton>\n        <\u002Fdiv>\n        <button class="sol-btn" style="height:36px;padding:0 16px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:20px;font-family:var(--sans);font-size:13px;font-weight:800;color:var(--accent-deep);cursor:pointer">Hoy<\u002Fbutton>\n        <div style="font-family:var(--serif);font-size:24px;font-weight:600;line-height:1;margin-left:2px">27 jul – 2 ago 2026<\u002Fdiv>\n        <div style="margin-left:auto;font-size:12.5px;color:var(--ink-faint)">Semana 31<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Reservas por día -->\n      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px">\n        <sc-for list="{{ libDays }}" as="d" hint-placeholder-count="3">\n          <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden">\n            <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel-2);border-bottom:1px solid var(--line-soft)">\n              <span style="font-family:var(--serif);font-size:20px;font-weight:600;text-transform:capitalize;line-height:1">{{ d.day }}<\u002Fspan>\n              <span style="font-size:13px;color:var(--ink-faint)">{{ d.date }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:14px 16px">\n              <sc-for list="{{ d.items }}" as="it" hint-placeholder-count="1">\n                <div class="sol-cell" style="{{ it.rowStyle }}">\n                  <div style="{{ it.chkStyle }}">{{ it.check }}<\u002Fdiv>\n                  <i class="ti {{ it.icon }}" style="font-size:19px;color:var(--ink-soft)"><\u002Fi>\n                  <div style="flex:1;min-width:0">\n                    <div style="font-size:15px;font-weight:700;line-height:1.15">{{ it.label }}<\u002Fdiv>\n                    <div style="font-size:12px;color:var(--ink-faint)">{{ it.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style="{{ it.pill }}">Aprobada<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- Motivo -->\n      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px">Motivo de la liberación<\u002Flabel>\n      <textarea placeholder="Ej.: El empleado estará de viaje y no usará estas reservas…" style="width:100%;min-height:96px;padding:14px 16px;background:var(--panel);border:1px solid #f2c4bd;border-radius:12px;font-family:var(--sans);font-size:15px;color:var(--ink);resize:vertical;outline:none;box-shadow:0 0 0 3px rgba(224,90,66,.08)"><\u002Ftextarea>\n      <div style="display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12.5px;color:#a2543a"><i class="ti ti-alert-circle" style="font-size:15px"><\u002Fi>Indica el motivo (mínimo 5 caracteres). Se aplica a todas las reservas marcadas y queda registrado en la auditoría.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Footer de acción -->\n    <div style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:18px;padding:16px 44px;background:rgba(251,247,239,.9);backdrop-filter:blur(8px);border-top:1px solid var(--line)">\n      <div style="display:inline-flex;align-items:center;gap:9px;font-size:14px;color:var(--ink-soft)"><span style="min-width:24px;height:24px;padding:0 7px;border-radius:20px;background:var(--green);color:#fff;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center">{{ libSelected }}<\u002Fspan>reserva(s) seleccionada(s)<\u002Fdiv>\n      <div style="margin-left:auto;display:flex;gap:10px">\n        <button class="sol-btn" style="height:44px;padding:0 20px;background:var(--panel);border:1px solid var(--line);border-radius:9px;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--ink-soft);cursor:pointer">Cancelar<\u002Fbutton>\n        <button class="sol-btn" style="height:44px;padding:0 22px;background:var(--green);border:none;border-radius:9px;font-family:var(--sans);font-size:14px;font-weight:800;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px"><i class="ti ti-arrow-back-up"><\u002Fi>Liberar reservas<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n  <\u002Fsc-if>\n\n
