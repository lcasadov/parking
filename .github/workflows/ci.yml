name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Permite a SonarCloud comentar en la PR y leer el contenido.
permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend (build, test, coverage, sonar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historico completo para el blame/new code.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # En los runners Ubuntu, Docker esta disponible con el socket estandar:
      # Testcontainers levanta SQL Server 2022 sin configuracion adicional.
      - name: Build, test and coverage
        run: mvn -B clean verify

      - name: SonarCloud analysis
        # Solo si el secreto esta presente (evita fallar en forks sin acceso).
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=lcasadov_parking
          -Dsonar.organization=lcasadov

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
