# nginx — sirve la SPA de parking y hace reverse-proxy de la API.
# Same-origin: el navegador habla solo con nginx (puerto 80); nginx reenvia
# /parking-api al backend Tomcat. Sin CORS. La cookie de sesion parking_SESSION
# fluye de forma transparente al ser mismo origen.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion de los assets estaticos.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy de la API. Se preserva el prefijo /parking-api (el backend
    # espera ese context-path): NO se reescribe el path. `backend` resuelve por
    # DNS interno de la red de docker-compose.
    location /parking-api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passthrough de cookies (sesion): no se reescriben dominio ni path.
        proxy_cookie_domain off;
        proxy_cookie_path   off;
        proxy_pass_request_headers on;

        # Margenes amplios para arranques/consultas lentas del backend.
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # SPA fallback: cualquier ruta de cliente cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
